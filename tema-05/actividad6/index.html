<!-- 

1. ¿Qué diferencia existe entre un frame y un iframe?

Un frame divide la pantalla del navegador en varias partes, mientras que un iframe permite meter una página web dentro de otra.

2. ¿Por qué los frames tradicionales dejaron de utilizarse?

Porque daban problemas al navegar por las páginas, eran difíciles de adaptar a móviles y resultaban poco cómodos para los usuarios.

3. ¿Qué ventajas ofrece una plantilla?

Permite utilizar la misma estructura en varias páginas, ahorrando tiempo y haciendo que todas tengan el mismo diseño.

4. ¿Qué problemas de seguridad pueden aparecer al utilizar iframes?

Pueden mostrar páginas peligrosas que intenten engañarnos, robar nuestros datos o hacer que pulsemos en enlaces sin darnos cuenta.

5. ¿Qué alternativas modernas existen para reutilizar componentes de una interfaz?

Se pueden utilizar herramientas como Angular, React o Vue, que permiten reutilizar partes de una página web sin tener que escribirlas otra vez.
